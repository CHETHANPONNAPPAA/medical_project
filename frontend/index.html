<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MedCare Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>🩺 MedCare</h2>
    <ul>
      <li class="active">Dashboard</li>
      <li>Patients</li>
      <li>Reports</li>
      <li>Settings</li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main">

    <!-- Topbar -->
    <div class="topbar">
      <h2>Liver Health Detection</h2>
      <span>👨‍⚕️ Doctor Panel</span>
    </div>

    <!-- Card -->
    <div class="card">

      <h3>Patient Details</h3>

      <div class="form-grid">
        <input id="Age" type="number" placeholder="Age">

        <select id="Gender">
          <option value="">Gender</option>
          <option>Male</option>
          <option>Female</option>
        </select>

        <input id="Total_Bilirubin" placeholder="Total Bilirubin">
        <input id="Direct_Bilirubin" placeholder="Direct Bilirubin">
        <input id="Alkaline_Phosphotase" placeholder="ALP">
        <input id="Alamine_Aminotransferase" placeholder="ALT">
        <input id="Aspartate_Aminotransferase" placeholder="AST">
        <input id="Total_Proteins" placeholder="Total Proteins">
        <input id="Albumin" placeholder="Albumin">
        <input id="Albumin_and_Globulin_Ratio" placeholder="A/G Ratio">
      </div>

      <button class="btn" onclick="predict()">Analyze Patient</button>

      <!-- Loader -->
      <div id="loader" class="loader hidden"></div>

      <!-- Result -->
      <div id="resultCard" class="result-card hidden">
        <h3>Diagnosis Result</h3>
        <p id="result"></p>
      </div>

    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
