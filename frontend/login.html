<!DOCTYPE html>
<html>
<head>
  <title>Login - MedCare</title>
  <link rel="stylesheet" href="style.css">
</head>

<body style="display:flex;justify-content:center;align-items:center;height:100vh;">

<div class="card" style="width:300px;">
  <h2>Login</h2>

  <input id="username" placeholder="Username"><br><br>
  <input id="password" type="password" placeholder="Password"><br><br>

  <button class="btn primary" onclick="login()">Login</button>
  <button class="btn outline" onclick="register()">Register</button>

  <p id="msg"></p>
</div>

<script>
const BASE_URL = "https://medical-project-c3re.onrender.com"; // keep same

function login(){
  fetch(`${BASE_URL}/login`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value
    })
  })
  .then(res=>res.json())
  .then(d=>{
    if(d.message){
      localStorage.setItem("loggedIn", true);
      window.location.href = "index.html";
    } else {
      document.getElementById("msg").innerText = d.error;
    }
  });
}

function register(){
  fetch(`${BASE_URL}/register`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value
    })
  })
  .then(res=>res.json())
  .then(d=>{
    document.getElementById("msg").innerText = d.message || d.error;
  });
}
</script>

</body>
</html>
