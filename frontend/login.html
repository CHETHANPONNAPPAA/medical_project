<!DOCTYPE html>
<html>
<head>
  <title>Login - MedCare</title>
  <link rel="stylesheet" href="style.css">

  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">


  <style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI';
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
  }

  .login-container {
  background: rgba(30, 58, 138, 0.85);
  backdrop-filter: blur(18px);

  width: 420px;          /* slightly reduced from 440 */
  padding: 60px 50px;    /* more vertical spacing */

  border-radius: 20px;
  color: white;
  box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  text-align: center;
  }

  .logo {
    font-size: 28px;
    margin-bottom: 10px;
  }

  h2 {
    margin-bottom: 25px;
  }

  .input-group {
    position: relative;
    margin-bottom: 18px;
  }

  .input-group i {
  position: absolute;
  top: 50%;
  left: 12px;
  transform: translateY(-50%);
  color: #475569; /* darker icon */
  }

  .input-group input {
  width: 100%;
  padding: 12px 12px 12px 40px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.25);
  outline: none;
  font-size: 14px;

  background: rgba(255,255,255,0.9);
  color: #1e293b;

  box-sizing: border-box; /* 🔥 important */
  }

  .input-group input::placeholder {
  color: #64748b;  /* subtle grey */
  }

  .input-group input:focus {
  border: 1px solid #3b82f6;
  box-shadow: 0 0 0 2px rgba(59,130,246,0.3);
  }

  .btn {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: 0.3s;
  }

  .primary {
    background: linear-gradient(90deg, #2563eb, #3b82f6);
    color: white;
  }

  .primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.3);
  }

  .outline {
    background: transparent;
    border: 2px solid rgba(255,255,255,0.6);
    color: white;
  }

  .outline:hover {
    background: rgba(255,255,255,0.1);
  }

  #msg {
    margin-top: 12px;
    font-size: 13px;
    color: #facc15;
  }
  </style>
</head>

<body>

<div class="login-container">

  <div class="logo">
    <i class="fa-solid fa-heart-pulse"></i>
  </div>

  <h2>MedCare Login</h2>

  <div class="input-group">
    <i class="fa fa-user"></i>
    <input id="username" placeholder="Username">
  </div>

  <div class="input-group">
    <i class="fa fa-lock"></i>
    <input id="password" type="password" placeholder="Password">
  </div>

  <button class="btn primary" onclick="login()">
    <i class="fa fa-sign-in-alt"></i> Login
  </button>

  <button class="btn outline" onclick="register()">
    <i class="fa fa-user-plus"></i> Register
  </button>

  <p id="msg"></p>

</div>

<script>
const BASE_URL = "https://medical-project-c3re.onrender.com";

function login(){
  fetch(`${BASE_URL}/login`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value
    })
  })
  .then(res=>res.json())
  .then(d=>{
    if(d.message){
      localStorage.setItem("loggedIn", true);
      window.location.href = "index.html";
    } else {
      document.getElementById("msg").innerText = d.error;
    }
  });
}

function register(){
  fetch(`${BASE_URL}/register`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value
    })
  })
  .then(res=>res.json())
  .then(d=>{
    document.getElementById("msg").innerText = d.message || d.error;
  });
}
</script>

</body>
</html>
