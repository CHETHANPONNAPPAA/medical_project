<!DOCTYPE html>
<html>
<head>
  <title>Login - MedCare</title>
  <link rel="stylesheet" href="style.css">

  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI';
      background: linear-gradient(135deg, #0f172a, #2563eb);
    }

    .login-container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      padding: 30px;
      width: 320px;
      border-radius: 15px;
      color: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
    }

    .login-container h2 {
      margin-bottom: 20px;
    }

    .input-group {
      position: relative;
      margin-bottom: 15px;
    }

    .input-group i {
      position: absolute;
      top: 12px;
      left: 10px;
      color: #ccc;
    }

    .input-group input {
      width: 100%;
      padding: 10px 10px 10px 35px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .outline {
      background: transparent;
      border: 2px solid white;
      color: white;
    }

    .btn:hover {
      opacity: 0.9;
    }

    #msg {
      margin-top: 10px;
      font-size: 14px;
    }

    .logo {
      font-size: 28px;
      margin-bottom: 10px;
    }

  </style>
</head>

<body>

<div class="login-container">

  <div class="logo">
    <i class="fa-solid fa-heart-pulse"></i>
  </div>

  <h2>MedCare Login</h2>

  <div class="input-group">
    <i class="fa fa-user"></i>
    <input id="username" placeholder="Username">
  </div>

  <div class="input-group">
    <i class="fa fa-lock"></i>
    <input id="password" type="password" placeholder="Password">
  </div>

  <button class="btn primary" onclick="login()">
    <i class="fa fa-sign-in-alt"></i> Login
  </button>

  <button class="btn outline" onclick="register()">
    <i class="fa fa-user-plus"></i> Register
  </button>

  <p id="msg"></p>

</div>

<script>
const BASE_URL = "https://medical-project-c3re.onrender.com";

function login(){
  fetch(`${BASE_URL}/login`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value
    })
  })
  .then(res=>res.json())
  .then(d=>{
    if(d.message){
      localStorage.setItem("loggedIn", true);
      window.location.href = "index.html";
    } else {
      document.getElementById("msg").innerText = d.error;
    }
  });
}

function register(){
  fetch(`${BASE_URL}/register`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value
    })
  })
  .then(res=>res.json())
  .then(d=>{
    document.getElementById("msg").innerText = d.message || d.error;
  });
}
</script>

</body>
</html>
